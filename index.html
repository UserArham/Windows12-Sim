<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 12 Visual Simulator</title>
<style>
/* ---------- Reset ---------- */
* {margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif;}

/* ---------- Desktop ---------- */
body, html {width:100%; height:100%; overflow:hidden;}
.desktop {
  width:100vw;
  height:100vh;
  position:relative;
  background: url("https://wallpapercave.com/wp/wp13842758.png") center/cover no-repeat;
}

/* ---------- Desktop Icons ---------- */
.icon {
  width:80px;
  text-align:center;
  margin:10px;
  color:white;
  display:inline-block;
  user-select:none;
  font-weight:500;
  text-shadow: 0 0 5px rgba(0,0,0,0.8);
  cursor:pointer;
  transition:0.2s;
}
.icon img {
  width:60px;
  height:60px;
  display:block;
  margin:0 auto 4px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.4);
}
.icon:hover {transform:scale(1.1);}

/* ---------- Windows ---------- */
.window {
  position:absolute;
  width:400px;
  height:300px;
  background:#f7f7f7;
  border-radius:8px;
  box-shadow: 5px 5px 25px rgba(0,0,0,0.5);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  resize:both;
}
.title-bar {
  background: linear-gradient(to right,#4a60d1,#6c7ce3);
  color:white;
  padding:6px 10px;
  cursor:grab;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}
.title-bar button {
  width:20px; height:20px;
  border:none;
  border-radius:50%;
  margin-left:4px;
  cursor:pointer;
}
.title-bar button.close {background:#ff5f56;}
.title-bar button.min {background:#ffbd2e;}
.title-bar button.max {background:#27c93f;}
.title-bar button:hover {filter:brightness(1.2);}
.window-content {
  flex:1;
  padding:10px;
  background:#fff;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* ---------- Taskbar ---------- */
.taskbar {
  position:absolute;
  bottom:0;
  width:100%;
  height:40px;
  background:rgba(60,60,200,0.85);
  display:flex;
  align-items:center;
  padding:0 10px;
  box-shadow:0 -3px 10px rgba(0,0,0,0.4);
  color:white;
  font-weight:bold;
}
.start-button {
  background:rgba(255,255,255,0.2);
  border:none;
  color:white;
  padding:5px 12px;
  cursor:pointer;
  border-radius:4px;
}
.start-button:hover {background:rgba(255,255,255,0.4);}

/* ---------- Start Menu ---------- */
.start-menu {
  position:absolute;
  bottom:40px;
  left:10px;
  width:220px;
  max-height:400px;
  background:#f7f7f7;
  border-radius:6px;
  box-shadow: 2px 2px 15px rgba(0,0,0,0.3);
  overflow-y:auto;
  display:none;
  z-index:9999;
}
.start-menu div {
  padding:8px 10px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.start-menu div:hover {background:#4a60d1; color:white;}

/* ---------- Styled Elements ---------- */
textarea, input[type=text], input[type=number], select {
  width:100%;
  padding:6px;
  border:1px solid #aaa;
  border-radius:4px;
}
button.app-btn {
  background:#4a60d1; color:white;
  border:none; padding:5px 8px; border-radius:4px;
  cursor:pointer;
}
button.app-btn:hover {background:#2d3ca7;}
table {border-collapse:collapse; width:100%;}
table, th, td {border:1px solid #888; text-align:center; padding:4px;}
th {background:#ddd;}
canvas {border:1px solid #888; border-radius:4px;}
img.app-img {width:100%; max-height:200px; object-fit:cover; border-radius:6px;}
</style>
</head>
<body>
<div class="desktop" id="desktop">
  <div class="taskbar">
    <button class="start-button" id="startBtn">Start</button>
  </div>
  <div class="start-menu" id="startMenu"></div>
</div>

<script>
/* ---------- Window Function ---------- */
function makeWindow(title, contentElement){
  const desktop=document.getElementById('desktop');
  const win=document.createElement('div');
  win.className='window';
  win.style.left='60px'; win.style.top='60px';
  win.style.zIndex=Date.now();
  win.innerHTML=`<div class="title-bar">${title}
    <div>
      <button class="min"></button>
      <button class="max"></button>
      <button class="close"></button>
    </div>
  </div><div class="window-content"></div>`;
  desktop.appendChild(win);
  win.querySelector('.window-content').appendChild(contentElement);

  // Close
  win.querySelector('.close').onclick=()=>win.remove();

  // Dragging
  const titleBar=win.querySelector('.title-bar');
  titleBar.onmousedown=(e)=>{
    const offsetX=e.clientX-win.offsetLeft;
    const offsetY=e.clientY-win.offsetTop;
    function move(e){win.style.left=e.clientX-offsetX+'px';win.style.top=e.clientY-offsetY+'px';}
    document.addEventListener('mousemove',move);
    document.addEventListener('mouseup',()=>document.removeEventListener('mousemove',move),{once:true});
  };
}

/* ---------- Apps with Pictures ---------- */
const apps=[
{name:"Photos",run:()=>{
  const div=document.createElement('div');
  ['https://picsum.photos/300/150?random=1','https://picsum.photos/300/150?random=2','https://picsum.photos/300/150?random=3'].forEach(src=>{
    const img=document.createElement('img'); img.src=src; img.className='app-img'; img.style.marginBottom='6px';
    div.appendChild(img);
  });
  return div;
}},
{name:"Video Player",run:()=>{
  const vid=document.createElement('video'); vid.controls=true; vid.width=360; vid.src='https://www.w3schools.com/html/mov_bbb.mp4';
  return vid;
}},
{name:"Music",run:()=>{
  const audio=document.createElement('audio'); audio.controls=true; audio.src='https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'; return audio;
}},
{name:"Paint",run:()=>{
  const canvas=document.createElement('canvas'); canvas.width=360; canvas.height=200; const ctx=canvas.getContext('2d');
  ctx.fillStyle='lightblue'; ctx.fillRect(0,0,360,200);
  return canvas;
}},
{name:"Calculator",run:()=>{
  const div=document.createElement('div'); const a=document.createElement('input'); a.type='number'; a.placeholder='Num 1';
  const b=document.createElement('input'); b.type='number'; b.placeholder='Num 2';
  const btn=document.createElement('button'); btn.className='app-btn'; btn.innerText='Add'; const res=document.createElement('p');
  btn.onclick=()=>{res.innerText='Result: '+(parseFloat(a.value||0)+parseFloat(b.value||0));};
  div.append(a,b,btn,res); return div;
}},
{name:"Notepad",run:()=>{const ta=document.createElement('textarea'); ta.style.height='100%'; ta.placeholder='Write notes...'; return ta;}},
{name:"Clock",run:()=>{const p=document.createElement('p'); p.style.fontSize='24px'; function update(){p.innerText=new Date().toLocaleTimeString();} update(); setInterval(update,1000); return p;}},
{name:"File Explorer",run:()=>{const ul=document.createElement('ul'); ['Documents','Downloads','Pictures','Music'].forEach(f=>{const li=document.createElement('li'); li.innerText=f; ul.appendChild(li);}); return ul;}},
{name:"Calendar",run:()=>{const table=document.createElement('table'); const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; const tr=document.createElement('tr'); days.forEach(d=>{const th=document.createElement('th'); th.innerText=d; tr.appendChild(th);}); table.appendChild(tr); for(let i=0;i<5;i++){const row=document.createElement('tr'); for(let j=1;j<=7;j++){const td=document.createElement('td'); td.innerText=(i*7+j); row.appendChild(td);} table.appendChild(row);} return table;}}
];

/* ---------- Desktop Icons ---------- */
const desktop=document.getElementById('desktop');
apps.forEach(app=>{
  const icon=document.createElement('div'); icon.className='icon'; 
  icon.innerHTML=`<img src="https://picsum.photos/60?random=${Math.floor(Math.random()*100)}"><span>${app.name}</span>`;
  icon.ondblclick=()=>{makeWindow(app.name,app.run());};
  desktop.appendChild(icon);
});

/* ---------- Start Menu ---------- */
const startBtn=document.getElementById('startBtn');
const startMenu=document.getElementById('startMenu');
startBtn.onclick=()=>{
  startMenu.style.display = startMenu.style.display==='block'?'none':'block';
  startMenu.innerHTML='';
  apps.forEach(app=>{
    const div=document.createElement('div'); div.innerText=app.name;
    div.onclick=()=>{makeWindow(app.name,app.run()); startMenu.style.display='none';};
    startMenu.appendChild(div);
  });
};
document.addEventListener('click', e=>{
  if(!startBtn.contains(e.target) && !startMenu.contains(e.target)) startMenu.style.display='none';
});
</script>
</body>
</html>
